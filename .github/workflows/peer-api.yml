name: Ensure API Peer Dependency

on:
  workflow_dispatch:

jobs:
  peer-api-check:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2023-12-14T12%3A35%3A26.107000Z@time-machines-npm.sealsecurity.io/
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lerna
        run: npm install -g lerna@6.6.2

      - name: Install semver
        run: npm install -g semver

      - name: Check API dependency semantics
        working-directory: packages
        run: lerna run peer-api-check

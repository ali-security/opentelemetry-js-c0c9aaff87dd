name: Unit Tests
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2023-12-14T12%3A35%3A26.107000Z@time-machines-npm.sealsecurity.io/
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: |
            package-lock.json
          node-version: '21'

      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: npx lerna run compile --scope @opentelemetry/propagator-jaeger --include-dependencies

      - name: Pack
        run: |
          mkdir -p ./dist
          npm pack --workspace=packages/opentelemetry-propagator-jaeger --pack-destination=./dist
          mv ./dist/opentelemetry-propagator-jaeger-1.19.0.tgz ./dist/propagator-jaeger-1.19.0.tgz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-tgz
          path: ./dist/propagator-jaeger-1.19.0.tgz
          if-no-files-found: error

  node-tests:
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - '14'
          - '16'
          - '18'
          - '20'
          - '21'
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2023-12-14T12%3A35%3A26.107000Z@time-machines-npm.sealsecurity.io/
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: |
            package-lock.json
          node-version: ${{ matrix.node_version }}

      # npm@10.0.0 drops support for Node.js v14 and v16
      - run: npm install -g npm@"<10.0.0"
        if: ${{ matrix.node_version == '14' || matrix.node_version == '16' }}

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npx lerna run compile --scope @opentelemetry/propagator-jaeger --include-dependencies

      - name: Unit tests
        run: |
          # TODO(legendecas): webpack https://stackoverflow.com/questions/69692842/error-message-error0308010cdigital-envelope-routinesunsupported
          if [ "${{ matrix.node_version }}" = "18" ] || [ "${{ matrix.node_version }}" == "20" ]; then
            export NODE_OPTIONS=--openssl-legacy-provider
          fi
          npx lerna run test --scope @opentelemetry/propagator-jaeger
  node-windows-tests:
    runs-on: windows-latest
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2023-12-14T12%3A35%3A26.107000Z@time-machines-npm.sealsecurity.io/
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: |
            package-lock.json
          node-version: '18'

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: |
          npm config set script-shell "C:\\Program Files\\git\\bin\\bash.exe"
          npx lerna run compile --scope @opentelemetry/propagator-jaeger --include-dependencies

      - name: Unit tests
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm config set script-shell "C:\\Program Files\\git\\bin\\bash.exe"
          npx lerna run test --scope @opentelemetry/propagator-jaeger
  browser-tests:
    if: false
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2023-12-14T12%3A35%3A26.107000Z@time-machines-npm.sealsecurity.io/
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: |
            package-lock.json
          node-version: 16

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm run test:browser
      - name: Report Coverage
        run: npm run codecov:browser
  webworker-tests:
    if: false
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2023-12-14T12%3A35%3A26.107000Z@time-machines-npm.sealsecurity.io/
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: |
            package-lock.json
          node-version: 16

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm run test:webworker
      - name: Report Coverage
        run: npm run codecov:webworker
  api-eol-node-test:
    if: false
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - '8'
          - '10'
          - '12'
    runs-on: ubuntu-latest
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2023-12-14T12%3A35%3A26.107000Z@time-machines-npm.sealsecurity.io/
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: |
            package-lock.json
          node-version: ${{ matrix.node_version }}

      - name: Build
        working-directory: ./api
        run: |
          npm install --ignore-scripts
          npm install @types/mocha@^7 mocha@^7 ts-loader@^8 ts-mocha@^8
          node ../scripts/version-update.js
          npx tsc --build tsconfig.json tsconfig.esm.json

      - name: Test
        working-directory: ./api
        # running test:eol as node 8 is not supported anymore by the version of nyc we use, as we don't report coverage
        # for this step we leave it out.
        # Details: nyc requires istanbul-lib-report, which silently dropped support for Node.js v8 when going from
        # 3.0.0 to 3.0.1 by requiring make-dir@^4.0.0 to fix https://github.com/advisories/GHSA-c2qf-rxjj-qqgw.
        # make-dir does not support Node.js v8 anymore.
        run: npm run test:eol

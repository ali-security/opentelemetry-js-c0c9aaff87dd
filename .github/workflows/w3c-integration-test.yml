name: W3C Trace Context Integration Test

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2023-12-14T12%3A35%3A26.107000Z@time-machines-npm.sealsecurity.io/
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: |
            package-lock.json
          node-version: '16'

      - name: Install and Bootstrap 🔧
        run: npm ci

      - name: Generate version.ts files
        run: npm run version:update

      - name: Build 🔧
        run: npm run compile
        working-directory: ./integration-tests/propagation-validation-server

      - name: Run W3C Test harness
        run: ./integration-tests/tracecontext-integration-test.sh
